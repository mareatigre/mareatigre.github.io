<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigía de Marea · Tigre</title>
<link rel="stylesheet" href="estilo.css">
<script src="datos/estado.js"></script>
<script src="datos/ejemplos.js"></script>
<script src="comun.js"></script>
</head><body><main id="app"></main>
<script>
// "eff" = pico previsto + ajuste por río (lo mismo que usa el programa para las probabilidades).
// (25/11) Un día "cola" (el máximo del modelo cae en la primera hora: el agua viene bajando) no es una pleamar prevista:
// no cuenta para "lo más alto previsto". Con un estado.js viejo (sin `cola`) todo sigue igual.
const prev = V.dias.filter(d => !d.cola);
const max = prev.length ? prev.reduce((a, d) => d.eff > a.eff ? d : a) : null;
// Sin ningún día de pronóstico y sin nada que avisar: no es "no se esperan mareas altas", es "no sabemos los próximos días".
const sinPron = !max && V.nivel === "normal";
const clase = sinPron ? "sin_datos" : V.nivel;
const nv = sinPron ? {ico: "⏳", titulo: "Sin pronóstico por ahora", color: "--mut"} : NIVELES[V.nivel];
const m2s = x => x.toFixed(2).replace(".", ",");

// Regla de marea. La escala se estira sola si el pico pasa 3,40 m, así un 3,30 sostenido se ve bien.
// La franja clara es el rango probable del día más alto (8 de cada 10 veces debería caer ahí, si el margen está bien).
function regla() {
  const W = 320, H = 270, x0 = 44, ancho = 90, top = 18, bot = H - 22;
  const hMax = Math.ceil(Math.max(3.4, max.rango[1] + 0.1) * 2) / 2, y = v => bot - (v / hMax) * (bot - top);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Altura máxima prevista ${m2(max.eff)}">`;
  s += `<rect x="${x0}" y="${top}" width="${ancho}" height="${bot - top}" rx="10" fill="${css('--bg')}" stroke="${css('--line')}"/>`;
  s += `<rect x="${x0}" y="${y(max.rango[1])}" width="${ancho}" height="${y(max.rango[0]) - y(max.rango[1])}" fill="${css('--agua')}" opacity=".22"/>`;
  s += `<rect x="${x0}" y="${y(max.eff)}" width="${ancho}" height="${bot - y(max.eff)}" rx="10" fill="${css('--agua')}" opacity=".85"/>`;
  for (let v = 0; v <= hMax + 1e-9; v += 0.5)
    s += `<text x="${x0 - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${css('--mut')}">${v.toFixed(1).replace(".", ",")}</text>`;
  // (26/11, Fernando) La línea de 2,40 queda siempre: es una referencia para el isleño. Sin texto debajo: lo del INA
  // (por qué 2,40 a veces cuenta como aviso) va como nota chica abajo del gráfico, y solo cuando hay señal.
  const marcas = [[V.umbrales.compuesto, "2,40 · atención", "--pos", 12],
                  [V.umbrales.aviso, "2,50 · aviso", "--avi", -4], [V.umbrales.alerta, "2,90 · alerta", "--ale", 4]];
  marcas.forEach(([v, t, c, dy]) => {
    const yy = y(v), ty = yy + dy, punteada = v === V.umbrales.compuesto;
    s += `<line x1="${x0 - 4}" x2="${x0 + ancho + 6}" y1="${yy}" y2="${yy}" stroke="${css(c)}" stroke-width="2" stroke-dasharray="${punteada ? '4 3' : ''}"/>`;
    s += `<text x="${x0 + ancho + 10}" y="${ty}" font-size="11.5" fill="${css(c)}" font-weight="600">${t}</text>`;
  });
  // El número va DENTRO de la barra (en blanco), así no lo pisan las líneas de 2,40 / 2,50 / 2,90.
  // Si la barra es muy baja para que entre, va arriba de la franja clara.
  const adentro = bot - y(max.eff) > 30;
  s += `<text x="${x0 + ancho / 2}" y="${adentro ? y(max.eff) + 20 : Math.max(top + 14, y(max.rango[1]) - 6)}" text-anchor="middle" font-size="15"
    font-weight="700" fill="${adentro ? "#fff" : css('--ink')}">${m2(max.eff)}</text>`;
  s += `<text x="${x0 + ancho / 2}" y="${H - 4}" text-anchor="middle" font-size="11" fill="${css('--mut')}">máximo previsto</text>`;
  return s + "</svg>";
}

// Con 5 días no entran los nombres largos: "Miércoles" pasa a "Mié" (Hoy y Mañana quedan enteros).
const corto = n => V.dias.length > 4 && n !== "Hoy" && n !== "Mañana" ? n.slice(0, 3) : n;

// (25/11) Tarjeta de "Hoy". El programa solo mira lo que QUEDA del día; después de una pleamar alta eso es la bajante
// (25/11: "2,05 a las 09:00" con 2,50 m medidos a las 07:45). Si lo medido hoy (`medido_hoy`, servidor v8) supera lo
// que queda previsto, o si lo que queda es solo la bajante (`cola`), se muestra lo medido. Color por altura medida con
// los umbrales de siempre (2,50 aviso / 2,90 alerta); por debajo, verde salvo que lo que queda del día marque otra cosa.
const ORD_N = ["normal", "posible", "aviso", "alerta"];
const nivelAltura = h => h >= V.umbrales.alerta ? "alerta" : h >= V.umbrales.aviso ? "aviso" : "normal";
function tarjetaDia(d) {
  const md = V.medido_hoy, hoy = nomDia(d.fecha) === "Hoy";
  let alt = m2s(d.eff), hs = `${d.hora} h${d.parcial ? " *" : ""}`, nv = nivelDia(d), rg = V.escalera, cls = "", luego = "";
  if (hoy && md && (d.cola || md.altura >= d.eff)) {
    // (26/11, pedido de Fernando) Arriba, grande, el pico que YA PASÓ (medido); abajo, chico, lo que queda del día
    // (si lo que queda es solo la bajante, no se muestra). El color, el peor de los dos.
    const nd = d.cola ? "normal" : nivelDia(d), na = nivelAltura(md.altura);
    alt = m2s(md.altura); hs = `pico ${hhmm(md.hora)}`; rg = false; cls = " medido";
    if (!d.cola) luego = `<div class="luego">luego ${m2s(d.eff)}<br>${d.hora} h</div>`;
    nv = ORD_N.indexOf(na) > ORD_N.indexOf(nd) ? na : nd;
  } else if (d.cola) {
    alt = "—"; hs = "bajando"; rg = false; nv = "normal";
  }
  return `<div class="dia${cls}">
      <div class="nom">${corto(nomDia(d.fecha))}</div><div class="fec">${ddmm(d.fecha)}</div>
      <div class="pto" style="background:var(${NIVELES[nv].color})"></div>
      <div class="alt">${alt}</div>
      ${rg ? `<div class="rg">${m2s(d.rango[0])}–${m2s(d.rango[1])}</div>` : ""}
      <div class="hs">${hs}</div>${luego}</div>`;
}

function tiraDias() {
  const medido = V.dias.some(d => nomDia(d.fecha) === "Hoy" && V.medido_hoy && (d.cola || V.medido_hoy.altura >= d.eff));
  return `<div class="dias">${V.dias.map(tarjetaDia).join("")}</div>
    ${medido ? '<p class="chico mut">Hoy: arriba, el pico que ya pasó (medido en San Fernando); abajo, lo que queda previsto para el resto del día.</p>' : ""}
    ${V.escalera ? '<p class="chico mut">Debajo de cada altura: el rango probable.</p>' : ""}
    ${V.dias.some(d => d.parcial) ? '<p class="chico mut">* Día incompleto: el pronóstico no llega a cubrirlo entero.</p>' : ""}`;
}

// (24/11) Chance de pasar las alturas que importan, para la caja de alerta. Reemplaza al "Entre X y Y" (rango del 80 %):
// el extremo de arriba se leía como un anuncio ("puede llegar a 2,95") cuando pasa 1 de cada 10 veces.
// Son los mismos números que ya calcula el programa (d.prob), no hay cuentas nuevas.
// Sin escalera: aviso y alerta (2,50 y 2,90). Con escalera (pico de 2,90 o más): las dos columnas de arriba del pico.
const pct = p => p < 1 ? "menos de 1 %" : p > 99 ? "más de 99 %" : `${p} %`;
function chances(d) {
  const us = V.escalera ? COLS.filter(u => u > d.eff).slice(0, 2) : [V.umbrales.aviso, V.umbrales.alerta];
  const L = us.filter(u => prob(d, u) != null).map(u => {
    const nom = u === V.umbrales.aviso ? " (aviso)" : u === V.umbrales.alerta ? " (alerta)" : "";
    return `<span class="ch"><b>${pct(prob(d, u))}</b> de pasar ${m2(u)}${nom}</span>`;
  });
  return L.length ? `<p class="chances">${L.join("")}</p>` : "";
}

// Caja de alerta: solo si hay algo. (24/11, pedido de Fernando) Primero, grande, CUÁNDO y CUÁNTO; después la chance de
// pasar aviso/alerta; el resto (de dónde sale, río, aclaración) en una sola línea chica.
function cajaAlerta() {
  if (V.nivel === "sin_datos") return `<section class="alerta-caja n-aviso"><h2>No se pudo leer ninguna fuente</h2>
    <p>Que no haya aviso <b>no</b> quiere decir que no haya riesgo. Mirá directamente el SHN y el INA (links al pie).</p></section>`;
  if (V.nivel === "normal") return "";
  const d = V.dias.filter(x => !x.cola && nivelDia(x) === V.nivel)[0];
  // Con el agua ya alta, la caja habla de lo MEDIDO (no del pico previsto, que puede haber quedado corto).
  if (!d || V.ocurriendo) return `<section class="alerta-caja n-${V.nivel}"><h2>${nv.ico} ${V.ocurriendo ? "El agua ya está alta" : nv.titulo}</h2>
    ${V.ultima_real ? `<p>Última altura medida en San Fernando: <b>${m2(V.ultima_real.altura)}</b> (${cuando(V.ultima_real.hora)}).</p>` : ""}
    <p class="chico">Seguí los avisos del SHN y de Defensa Civil de Tigre. Esto es solo una ayuda para prepararse.</p></section>`;
  const sost = V.dias.filter(x => x.eff >= V.umbrales.aviso).length;
  const extras = [
    d.fuente === "SHN" ? "Pronóstico oficial del SHN." : "Lo marca el modelo del SHN; todavía no es pronóstico oficial.",
    sost > 1 ? `El agua se mantendría alta ${sost} días seguidos.` : "",
    d.compuesto ? "El Delta viene crecido (INA): con sudestada drena peor y puede subir más." : "",
    V.rio && V.rio.ajuste > 0 ? `Por el río alto (${V.rio.estacion} ${m2(V.rio.nivel)}) ya se le sumaron ${m2(V.rio.ajuste)}.` : ""
  ].filter(Boolean).join(" ");
  return `<section class="alerta-caja n-${V.nivel}">
    <div class="cuando">${nomDia(d.fecha)} ${ddmm(d.fecha)} · ${d.hora} h</div>
    <div class="cuanto"><b>${m2(d.eff)}</b> en San Fernando · en Tigre, a las ${horaTigre(d.hora)} h aprox.</div>
    ${chances(d)}
    <p class="chico">${extras}</p>
    ${amarillosAltos(d)}
    <p class="chico mut">Es una ayuda para prepararse: seguí al SHN y a Defensa Civil de Tigre.</p>
  </section>`;
}

// Si hay días en amarillo con alturas de aviso o más, explicarlo para que no confunda.
function amarillosAltos(d0) {
  const A = V.dias.filter(x => x !== d0 && nivelDia(x) === "posible" && x.eff >= V.umbrales.aviso);
  if (!A.length) return "";
  return `<p class="chico"><b>Días en amarillo con agua alta</b> (${A.map(x => nomDia(x.fecha).toLowerCase()).join(", ")}):
    solo los marca el modelo; pasan a aviso o alerta cuando el SHN los incluya en su pronóstico oficial.</p>`;
}

const bajada = !max ? "No hay pronósticos vigentes para las próximas horas"
  : V.nivel === "normal" ? (V.dias.length === 1 ? "en el próximo día" : `en los próximos ${V.dias.length} días`)
  : `Lo más alto: ${nomDia(max.fecha).toLowerCase()} cerca de las ${max.hora} h`;
const ahoraTxt = !V.ultima_real ? "" : `<div class="ahora">Última altura medida en San Fernando: <b style="white-space:nowrap">${m2(V.ultima_real.altura)}</b>
  (${cuando(V.ultima_real.hora)}${V.ultima_real.fresco === false ? ", dato viejo" : ""})</div>`;

document.getElementById("app").innerHTML = cabecera("index.html") + avisosArriba() + `
  <section class="veredicto n-${clase}">
    <div class="icono">${nv.ico}</div>
    <div class="titulo">${nv.titulo}</div>
    <div class="bajada">${bajada}</div>
    ${ahoraTxt}
  </section>
  ${cajaAlerta()}
  ${!max ? "" : `<section class="card">
    <h2>¿Hasta dónde llegaría el agua?</h2>
    ${regla()}
    <p class="chico">Lo más alto previsto: <b>${m2(max.eff)}</b> ${elDia(max.fecha)} ${ddmm(max.fecha)}
      a las ${max.hora} h en San Fernando (en Tigre, aprox. una hora después).
      La franja clara es el margen de error: 8 de cada 10 veces el agua queda entre ${rango(max)};
      1 de cada 10, por encima.</p>
      ${(() => { const f = franjaDe(max.eff); return f && f.pocos ? `<p class="chico"><b>Ojo:</b> el modelo tiene poca experiencia en
        alturas previstas de ${nomFranja(f)} (${f.picos === 0 ? "ningún pico medido" : f.picos + " pico" + (f.picos > 1 ? "s" : "") + " medido" + (f.picos > 1 ? "s" : "")}):
        tomá estos números con más cautela. <a href="${enl('resultados.html')}">Ver experiencia</a></p>` : ""; })()}
      ${V.sube_al_final ? '<p class="chico"><b>Ojo:</b> la curva del modelo sigue subiendo al final de los 4 días; el pico puede ser mayor.</p>' : ""}
      ${V.senal_ina ? '<p class="chico mut">Los ríos vienen crecidos (dato del INA): por eso desde 2,40 m ya se considera aviso.</p>' : ""}
  </section>
  <section class="card"><h2>Día por día</h2>${tiraDias()}${leyenda()}</section>`}
  <section class="botones">
    <a class="boton" href="${enl('probabilidades.html')}"><span class="ico">🌊</span>
      <span><b>Probabilidades</b><span class="d">${V.escalera ? "Chance de pasar cada altura, alrededor del pico" : "Chance de pasar 2,40 / 2,50 / 2,90 m cada día"}</span></span><span class="fl">›</span></a>
    <a class="boton" href="${enl('resultados.html')}"><span class="ico">📏</span>
      <span><b>Pronóstico y medición</b><span class="d">Cuánto se alejó la marea real de lo previsto</span></span><span class="fl">›</span></a>
  </section>` + pie();
</script>
<script data-goatcounter="https://mareatigre.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body></html>
