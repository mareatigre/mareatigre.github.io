<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probabilidades · Vigía de Marea Tigre</title>
<link rel="stylesheet" href="estilo.css">
<script src="datos/estado.js"></script>
<script src="datos/ejemplos.js"></script>
<script src="comun.js"></script>
</head><body><main id="app"></main>
<script>
// Color de la celda: más intenso cuanto más alta la chance (escala continua, sin cortes inventados).
const celda = (p, c) => `<span class="pc" style="background:color-mix(in srgb, var(${c}) ${Math.min(85, 8 + p * 0.8)}%, transparent);
  color:${p >= 50 ? "#fff" : "var(--ink)"}">${p < 1 ? "<1" : p}%</span>`;
// Colores de columna: con la escalera no son 2,40/2,50/2,90, así que van de suave a fuerte.
const COLORES = V.escalera ? ["--pos", "--avi", "--ale", "--ale"] : ["--pos", "--avi", "--ale"];
const filas = V.dias.map(d => `<tr>
  <td><b>${nomDia(d.fecha)}</b> <span class="mut">${ddmm(d.fecha)}</span>${d.parcial ? " *" : ""}<br>
      <span class="chico" style="white-space:nowrap">${d.eff.toFixed(2).replace(".", ",")} ±${d.margen.toFixed(2).replace(".", ",")}</span></td>
  ${COLS.map((u, i) => `<td>${celda(prob(d, u), COLORES[i])}</td>`).join("")}</tr>`).join("");
const encab = COLS.map(u => `<th>${u.toFixed(2).replace(".", ",")} m</th>`).join("");
const notaEsc = V.escalera ? `<section class="card"><h2>¿Por qué cambiaron las alturas?</h2>
  <p class="chico">Cuando lo previsto llega a 2,90 m o más, preguntar por 2,40 / 2,50 / 2,90 ya no dice nada: casi seguro
  se pasan. Por eso la tabla se acomoda sola alrededor del pico más alto (${m2(V.escalera.centro)}), con escalones de
  ${m2(V.escalera.paso)} (el margen de error a ese plazo).</p>
  <p class="chico">Rango probable de cada día: ${V.dias.map(d => `<b>${nomDia(d.fecha)}</b> ${rango(d)}`).join(" · ")}.</p></section>` : "";
const r = V.rio;
const rioTxt = !r ? "Sin dato del INA en esta corrida." :
  `${r.estacion}: <b>${m2(r.nivel)}</b>${r.tendencia == null ? "" : `, ${r.tendencia >= 0 ? "subiendo" : "bajando"}
   ${Math.abs(r.tendencia).toFixed(2).replace(".", ",")} m por día (promedio de 7 días)`}.
   ${r.eta_dias != null ? `<b>A este ritmo llegaría a ${m2(r.umbral)} en unos ${Math.round(r.eta_dias)} días</b> (proyección en línea recta, muy orientativa). ` : ""}
   ${r.ajuste > 0 ? `Como pasó los ${m2(r.umbral)}, se suman ${m2(r.ajuste)} al pico.`
                  : `Con el río por encima de ${m2(r.umbral)} en ${r.estacion} las mareas suelen subir unos 0,30 m más; hoy no se suma nada.`}`;
document.getElementById("app").innerHTML = cabecera("probabilidades.html") + avisosArriba() + `
  <h1>Probabilidades</h1>
  <p class="chico">Chance de que el agua pase cada altura en San Fernando, día por día.</p>
  <section class="card">
    ${!V.dias.length ? '<p>No hay pronóstico disponible ahora.</p>' : `<table><tr><th>Día · pico previsto</th>${encab}</tr>${filas}</table>`}
    ${V.dias.some(d => d.parcial) ? '<p class="chico mut">* Día incompleto: la probabilidad puede quedar baja de más.</p>' : ""}
  </section>${notaEsc}
  <section class="card"><h2>El río</h2>
    <p class="chico">${rioTxt}</p>
  </section>
  <section class="card"><details><summary>¿De dónde salen estos números?</summary>
    <p class="chico">Se toma el pico previsto de cada día (SHN o Modelo de Altura Total) y el error típico que tuvo
      el modelo a ese plazo, medido con los pronósticos guardados desde el 27/10/2026 (el “±” de cada día).
      Con eso se calcula la chance suponiendo que el error se reparte como una campana.</p>
    <p class="chico"><b>Qué puede fallar:</b> hay pocas semanas de datos y casi ningún evento alto; en sudestadas fuertes
      el error real puede ser mayor y las probabilidades quedar confiadas de más. Además, hasta ahora el agua real
      quedó más veces <i>arriba</i> de lo previsto.</p>
  </details></section>` + pie();
</script></body></html>
